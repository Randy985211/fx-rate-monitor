name: 外汇牌价监控

on:
  schedule:
    # UTC时区，每5分钟执行一次；周期类表达式不受时区偏移影响
    - cron: '*/5 * * * *'
  workflow_dispatch:  # 支持页面手动触发

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 设置系统时区为 Asia/Shanghai（北京时间）
        run: sudo timedatectl set-timezone Asia/Shanghai

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 运行监控抓取脚本
        run: |
          python scripts/run.py
      
      - name: 生成图表数据
        run: |
          python scripts/generate_chart_data.py
      
      - name: 提交并推送更新数据
        run: |
          git config --local user.email "fx-monitor-bot@users.noreply.github.com"
          git config --local user.name "FX Monitor Bot"
          git add -A
          if git diff --staged --quiet; then
            echo "✅ 无数据变化，跳过本次提交"
          else
            git commit -m "更新外汇牌价数据 $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi
