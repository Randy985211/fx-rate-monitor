<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外汇牌价实时监控</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        
        .header .update-time {
            font-size: 1rem;
            opacity: 0.9;
        }
        
        .header .update-time span {
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .bank-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
        }
        
        .bank-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
            color: white;
        }
        
        .bank-abc { background: linear-gradient(135deg, #00753A, #00a862); }
        .bank-cmbc { background: linear-gradient(135deg, #005BAC, #0088cc); }
        .bank-boc { background: linear-gradient(135deg, #C41E3A, #e74c3c); }
        
        .currency-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .currency-tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            background: #f5f5f5;
            color: #666;
        }
        
        .currency-tab.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .price-display {
            text-align: center;
            margin-bottom: 16px;
        }
        
        .price-label {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 4px;
        }
        
        .price-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #333;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
        }
        
        .price-change {
            font-size: 0.9rem;
            margin-top: 4px;
        }
        
        .price-change.up { color: #e74c3c; }
        .price-change.down { color: #27ae60; }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid #eee;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-label {
            font-size: 0.75rem;
            color: #999;
            margin-bottom: 4px;
        }
        
        .stat-value {
            font-size: 1rem;
            font-weight: 600;
            color: #333;
        }
        
        .chart-section {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            margin-bottom: 30px;
        }
        
        .chart-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .chart-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 2px;
        }
        
        .chart-container {
            position: relative;
            height: 400px;
        }
        
        .comparison-section {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        
        .comparison-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .comparison-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 2px;
        }
        
        .comparison-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .comparison-table th {
            background: #f8f9fa;
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: #666;
            font-size: 0.9rem;
            border-bottom: 2px solid #eee;
        }
        
        .comparison-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
        }
        
        .comparison-table tr:hover {
            background: #fafafa;
        }
        
        .best-price {
            background: #e8f5e9 !important;
            font-weight: 600;
            color: #2e7d32 !important;
        }
        
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.7);
            margin-top: 30px;
            font-size: 0.85rem;
        }
        
        .footer a {
            color: rgba(255,255,255,0.9);
            text-decoration: none;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .cards-grid {
                grid-template-columns: 1fr;
            }
            
            .chart-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💹 外汇牌价实时监控</h1>
            <div class="update-time">
                <span id="updateTime">加载中...</span>
            </div>
        </div>
        
        <div class="cards-grid" id="cardsGrid">
            <div class="loading pulse">正在加载数据...</div>
        </div>
        
        <div class="chart-section">
            <div class="chart-title">历史趋势对比</div>
            <div class="chart-container">
                <canvas id="trendChart"></canvas>
            </div>
        </div>
        
        <div class="comparison-section">
            <div class="comparison-title">银行价格对比</div>
            <table class="comparison-table">
                <thead>
                    <tr>
                        <th>银行</th>
                        <th>币种</th>
                        <th>现汇买入价</th>
                        <th>现汇卖出价</th>
                        <th>数据来源</th>
                        <th>更新时间</th>
                    </tr>
                </thead>
                <tbody id="comparisonBody">
                </tbody>
            </table>
        </div>
        
        <div class="footer">
            <p>数据仅供参考，实际汇率以银行柜台成交价为准</p>
            <p>基于 GitHub Actions 自动监控 · 每2分钟检测一次变化</p>
        </div>
    </div>

    <script>
        let chartData = null;
        let currentCurrency = '美元';
        let trendChart = null;
        
        const bankColors = {
            '农业银行': { main: '#00753A', light: 'rgba(0, 117, 58, 0.1)' },
            '民生银行': { main: '#005BAC', light: 'rgba(0, 91, 172, 0.1)' },
            '中国银行': { main: '#C41E3A', light: 'rgba(196, 30, 58, 0.1)' }
        };
        
        const bankBadgeClass = {
            '农业银行': 'bank-abc',
            '民生银行': 'bank-cmbc',
            '中国银行': 'bank-boc'
        };
        
        // 加载数据
        async function loadData() {
            try {
                const response = await fetch('chart_data.json?t=' + Date.now());
                chartData = await response.json();
                renderAll();
            } catch (error) {
                console.error('加载数据失败:', error);
                document.getElementById('cardsGrid').innerHTML = '<div class="loading">数据加载失败，请刷新重试</div>';
            }
        }
        
        function renderAll() {
            document.getElementById('updateTime').textContent = '最后更新: ' + chartData.update_time;
            renderCards();
            renderChart();
            renderComparison();
        }
        
        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            const banks = Object.keys(chartData.current);
            
            grid.innerHTML = banks.map(bank => {
                const currencies = Object.keys(chartData.current[bank]);
                const stats = chartData.stats[bank] || {};
                
                const currencyTabs = currencies.map(curr => `
                    <div class="currency-tab ${curr === currentCurrency ? 'active' : ''}" 
                         onclick="switchCurrency('${curr}')">${curr}</div>
                `).join('');
                
                const currentPrice = chartData.current[bank][currentCurrency];
                const stat = stats[currentCurrency] || {};
                
                // 计算涨跌
                let changeHtml = '';
                if (chartData.history[bank] && chartData.history[bank][currentCurrency]) {
                    const history = chartData.history[bank][currentCurrency];
                    if (history.length >= 2) {
                        const last = history[history.length - 1].value;
                        const prev = history[history.length - 2].value;
                        const diff = last - prev;
                        const pct = ((diff / prev) * 100).toFixed(3);
                        const isUp = diff >= 0;
                        changeHtml = `<div class="price-change ${isUp ? 'up' : 'down'}">
                            ${isUp ? '↑' : '↓'} ${Math.abs(diff).toFixed(3)} (${isUp ? '+' : ''}${pct}%)
                        </div>`;
                    }
                }
                
                return `
                    <div class="card">
                        <div class="card-header">
                            <span class="bank-name">${bank}</span>
                            <span class="bank-badge ${bankBadgeClass[bank]}">现汇买入价</span>
                        </div>
                        <div class="currency-tabs">
                            ${currencyTabs}
                        </div>
                        <div class="price-display">
                            <div class="price-label">100 ${currentCurrency === '美元' ? 'USD' : 'EUR'} / CNY</div>
                            <div class="price-value">${currentPrice['现汇买入价']}</div>
                            ${changeHtml}
                        </div>
                        <div class="stats-row">
                            <div class="stat-item">
                                <div class="stat-label">最高</div>
                                <div class="stat-value">${stat.high ? stat.high.toFixed(3) : '-'}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">最低</div>
                                <div class="stat-value">${stat.low ? stat.low.toFixed(3) : '-'}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">记录数</div>
                                <div class="stat-value">${stat.count || 0}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function switchCurrency(currency) {
            currentCurrency = currency;
            renderCards();
            renderChart();
            renderComparison();
        }
        
        function renderChart() {
            const ctx = document.getElementById('trendChart').getContext('2d');
            
            if (trendChart) {
                trendChart.destroy();
            }
            
            const banks = Object.keys(chartData.history);
            const datasets = banks.map(bank => {
                const history = chartData.history[bank][currentCurrency] || [];
                return {
                    label: bank,
                    data: history.map(h => h.value),
                    borderColor: bankColors[bank].main,
                    backgroundColor: bankColors[bank].light,
                    borderWidth: 2,
                    fill: false,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 6,
                };
            });
            
            // 获取所有时间标签
            const allLabels = [];
            banks.forEach(bank => {
                const history = chartData.history[bank][currentCurrency] || [];
                history.forEach(h => {
                    if (!allLabels.includes(h.time)) {
                        allLabels.push(h.time);
                    }
                });
            });
            allLabels.sort();
            
            // 为每个数据集填充对应时间点的数据
            const filledDatasets = banks.map((bank, idx) => {
                const history = chartData.history[bank][currentCurrency] || [];
                const valueMap = {};
                history.forEach(h => {
                    valueMap[h.time] = h.value;
                });
                
                let lastValue = null;
                const data = allLabels.map(time => {
                    if (valueMap[time] !== undefined) {
                        lastValue = valueMap[time];
                    }
                    return lastValue;
                });
                
                return {
                    ...datasets[idx],
                    data: data
                };
            });
            
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: allLabels.map(t => t.split(' ')[1] || t),
                    datasets: filledDatasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                usePointStyle: true,
                                padding: 20,
                                font: {
                                    size: 13
                                }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            padding: 12,
                            titleFont: { size: 13 },
                            bodyFont: { size: 12 },
                            callbacks: {
                                title: function(context) {
                                    const idx = context[0].dataIndex;
                                    return allLabels[idx];
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                maxTicksLimit: 10,
                                font: { size: 11 }
                            }
                        },
                        y: {
                            grid: {
                                color: 'rgba(0, 0, 0, 0.05)'
                            },
                            ticks: {
                                font: { size: 11 },
                                callback: function(value) {
                                    return value.toFixed(2);
                                }
                            }
                        }
                    }
                }
            });
        }
        
        function renderComparison() {
            const tbody = document.getElementById('comparisonBody');
            const banks = Object.keys(chartData.current);
            
            // 找出最优价格
            let bestPrice = 0;
            banks.forEach(bank => {
                const price = parseFloat(chartData.current[bank][currentCurrency]['现汇买入价']);
                if (price > bestPrice) bestPrice = price;
            });
            
            tbody.innerHTML = banks.map(bank => {
                const data = chartData.current[bank][currentCurrency];
                const price = parseFloat(data['现汇买入价']);
                const isBest = price === bestPrice;
                
                return `
                    <tr>
                        <td><strong>${bank}</strong></td>
                        <td>${currentCurrency}</td>
                        <td class="${isBest ? 'best-price' : ''}">${data['现汇买入价']} ${isBest ? '✓ 最优' : ''}</td>
                        <td>${data['现汇卖出价']}</td>
                        <td>${data['fetch_time'].split(' ')[0]}</td>
                        <td>${data['fetch_time']}</td>
                    </tr>
                `;
            }).join('');
        }
        
        // 自动刷新（每30秒）
        setInterval(loadData, 30000);
        
        // 初始加载
        loadData();
    </script>
</body>
</html>
